name: Publish Terraria runtime

on:
  push:
    branches: [main]
    paths:
      - runtime/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/bacon0033/homepute-terraria-unit:1.0.0
            ghcr.io/bacon0033/homepute-terraria-unit:latest
          provenance: false
