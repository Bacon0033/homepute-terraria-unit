name: Publish Terraria runtime

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  acceptance:
    permissions:
      contents: read
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl --fail --location --retry 2 https://www.terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip -o runtime/terraria-server.zip
          docker build -t local/terraria:acceptance runtime
          python3 test/runtime-smoke.py local/terraria:acceptance

  image:
    needs: acceptance
    environment: marketplace-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the approved SDK evidence revision
        env:
          EVIDENCE_REF: ${{ vars.HOMEPUTE_SDK_EVIDENCE_COMMIT }}
        run: '[[ "$EVIDENCE_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: Bacon0033/homepute-playtest-room
          ref: ${{ vars.HOMEPUTE_SDK_EVIDENCE_COMMIT }}
          token: ${{ secrets.HOMEPUTE_SDK_EVIDENCE_READ_TOKEN }}
          persist-credentials: false
          path: sdk-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every approved SDK case
        run: node sdk-evidence/unit/release-gate.mjs sdk-evidence/reports/local-baseline.json
      - run: curl --fail --location --retry 2 https://www.terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip -o runtime/terraria-server.zip
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: runtime
        with:
          context: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/bacon0033/homepute-terraria-unit:1.1.0
            ghcr.io/bacon0033/homepute-terraria-unit:latest
          provenance: false

      - name: Prepare the pinned marketplace manifest
        env:
          IMAGE_DIGEST: ${{ steps.runtime.outputs.digest }}
        run: node sdk-evidence/unit/prepare-manifest.mjs sdk-evidence/reports/local-baseline.json release/manifest.template.json "$IMAGE_DIGEST" release/homepute.unit.json
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-manifest
          path: release/homepute.unit.json
